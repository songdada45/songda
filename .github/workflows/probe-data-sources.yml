name: probe-data-sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测各行情接口在 GitHub runner 上是否可用
        run: |
          set +e
          echo "=== runner IP / 地区 ==="
          curl -s -m 8 https://ipinfo.io/json || true
          echo
          probe() {
            name="$1"; url="$2"
            code=$(curl -s -o /tmp/out.txt -w "%{http_code}" -m 12 "$url")
            size=$(wc -c < /tmp/out.txt)
            echo "--- $name  HTTP=$code  bytes=$size"
            head -c 180 /tmp/out.txt; echo
          }
          probe "腾讯 gtimg 日K"   "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=sz399006,day,,,5,qfq"
          probe "腾讯 qt 实时"      "https://qt.gtimg.cn/q=sz399006"
          probe "东财 push2his"     "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=0.399006&fields1=f1,f2&fields2=f51,f52,f53&klt=101&fqt=2&end=20500101&lmt=5"
          probe "东财 push2"        "https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=5&fs=m:0+t:80&fields=f12,f14"
          probe "新浪 K线"          "https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketData.getKLineData?symbol=sz399006&scale=240&ma=no&datalen=5"
          probe "新浪 hq"           "https://hq.sinajs.cn/list=sz399006"
          probe "Yahoo 399006.SZ"   "https://query1.finance.yahoo.com/v8/finance/chart/399006.SZ?range=5d&interval=1d"
          probe "国证官网"          "https://www.cnindex.com.cn/sample-detail/download-history?indexcode=399673"
          probe "中证官网"          "https://www.csindex.com.cn/csindex-home/indexInfo/index-basic-info?indexCode=000688"
          echo "=== 完成 ==="
