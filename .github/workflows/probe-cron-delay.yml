name: probe-cron-delay

on:
  schedule:
    - cron: "45 2 * * *"
    - cron: "0 3 * * *"
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 记录实际启动时间
        run: |
          echo "UTC now : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "BJ  now : $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "event    : ${{ github.event_name }}"
          echo "schedule : ${{ github.event.schedule }}"
          echo "created  : ${{ github.event.repository.updated_at }}"
