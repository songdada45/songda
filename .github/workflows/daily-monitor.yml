name: 每日成长/红利风格轮动监控

on:
  schedule:
    # GitHub 的 schedule 在本仓库实测延迟 8~10 小时，所以按「北京时间」倒推撒多个点，
    # 由 build_daily_chart.py 的收盘窗口判断决定是否真的推送（凌晨/早盘自动跳过）。
    - cron: "30 22 * * 0-4"   # 北京 06:30（延迟后≈15:30）
    - cron: "30 23 * * 0-4"   # 北京 07:30（延迟后≈16:30）
    - cron: "30 0 * * 1-5"    # 北京 08:30（延迟后≈17:30）
    - cron: "30 1 * * 1-5"    # 北京 09:30（延迟后≈18:30）
    - cron: "30 7 * * 1-5"    # 北京 15:30（调度正常时的兜底）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成不发送（跳过飞书推送，用于验证）"
        type: boolean
        default: false
      force:
        description: "强制发送（忽略收盘时间窗口，盘中也发）"
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 缓存行情数据（避免每天全量重抓）
        uses: actions/cache@v4
        with:
          path: |
            .growth_dividend_cache
            .kechuang50_cache
          key: market-cache-${{ github.run_id }}
          restore-keys: |
            market-cache-

      - name: 安装中文字体（失败不阻断）
        continue-on-error: true
        run: |
          set +e
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk && break
            echo "第 $i 次安装失败，5 秒后重试"; sleep 5
          done
          fc-list :lang=zh | head -3 || true
      - name: 安装依赖（失败不阻断）
        continue-on-error: true
        run: pip install -r requirements.txt
      - name: 运行成长/红利风格轮动监控(创业版)
        if: always()
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: |
          for i in 1 2 3; do
            python growth_dividend_monitor.py && break
            echo "创红第 $i 次失败，60s 后重试"; sleep 60
          done
      - name: 冷却 90s，避免同一出口 IP 连续请求被限流
        if: always()
        run: sleep 90

      - name: 运行科创50/红利风格轮动监控(科创版)
        if: always()
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: |
          for i in 1 2 3; do
            python kechuang50_monitor.py && break
            echo "科红第 $i 次失败，60s 后重试"; sleep 60
          done
      - name: 取数据日
        id: dd
        if: always()
        run: |
          D=$(python - <<'PY'
          import glob, json
          fs = sorted(glob.glob(".daily_digest/*.json"))
          out = ""
          for f in fs:
              try:
                  out = json.load(open(f, encoding="utf-8")).get("date") or out
              except Exception:
                  pass
          print(out)
          PY
          )
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "数据日: $D"

      - name: 检查当日是否已推送（缓存标记）
        id: sentmark
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: .sent_marker
          key: sent-v2-${{ steps.dd.outputs.date }}

      - name: 生成「每日一图」并推送（失败回退文字日报）
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          FORCE_SEND: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          SKIP_SEND: ${{ steps.sentmark.outputs.cache-hit == 'true' && '1' || '0' }}
        run: |
          for i in 1 2 3; do
            python build_daily_chart.py && break
            echo "出图第 $i 次失败，改发文字版"
            python send_daily_digest.py && break
            sleep 30
          done
          true

      - name: 判断今天是否真的发过（有标记文件）
        id: mark
        if: always()
        run: |
          if [ -f .sent_marker ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"; echo "已发送，写标记"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"; echo "未发送，不写标记"
          fi

      - name: 记录当日已推送（缓存标记）
        if: always() && steps.mark.outputs.ok == '1'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .sent_marker
          key: sent-v2-${{ steps.dd.outputs.date }}

      - name: 试跑模式：只出图不发送
        if: always() && github.event.inputs.dry_run == 'true'
        env:
          FEISHU_APP_SECRET: ""
        run: python build_daily_chart.py || true

      - name: 存档文字日报
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-${{ github.run_id }}
          path: .daily_digest/*
          include-hidden-files: true
          retention-days: 14

      - name: 存档图表(创业版)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charts-${{ github.run_id }}
          path: .growth_dividend_cache/chart_all_in_one_*.png
          retention-days: 7
      - name: 存档图表(科创版)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charts-kechuang-${{ github.run_id }}
          path: .kechuang50_cache/chart_all_in_one_*.png
          retention-days: 7

