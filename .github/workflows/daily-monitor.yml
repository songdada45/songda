name: 每日成长/红利风格轮动监控

on:
  schedule:
    - cron: "30 7 * * 1-5"    # 北京 15:30 主跑
    - cron: "30 8 * * 1-5"    # 北京 16:30 兜底（当日已发则跳过）
    - cron: "30 9 * * 1-5"    # 北京 17:30 兜底
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成不发送（跳过飞书推送，用于验证）"
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 缓存行情数据（避免每天全量重抓）
        uses: actions/cache@v4
        with:
          path: |
            .growth_dividend_cache
            .kechuang50_cache
          key: market-cache-${{ github.run_id }}
          restore-keys: |
            market-cache-

      - name: 安装中文字体（失败不阻断）
        continue-on-error: true
        run: |
          set +e
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk && break
            echo "第 $i 次安装失败，5 秒后重试"; sleep 5
          done
          fc-list :lang=zh | head -3 || true
      - name: 安装依赖（失败不阻断）
        continue-on-error: true
        run: pip install -r requirements.txt
      - name: 运行成长/红利风格轮动监控(创业版)
        if: always()
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: |
          for i in 1 2 3; do
            python growth_dividend_monitor.py && break
            echo "创红第 $i 次失败，60s 后重试"; sleep 60
          done
      - name: 冷却 60s，避免同一出口 IP 连续请求被限流
        if: always()
        run: sleep 60

      - name: 运行科创50/红利风格轮动监控(科创版)
        if: always()
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: |
          for i in 1 2 3; do
            python kechuang50_monitor.py && break
            echo "科红第 $i 次失败，60s 后重试"; sleep 60
          done
      - name: 生成「每日一图」并推送（失败回退文字日报）
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: |
          for i in 1 2 3; do
            python build_daily_chart.py && break
            echo "出图第 $i 次失败，改发文字版"
            python send_daily_digest.py && break
            sleep 30
          done
          true

      - name: 试跑模式：只出图不发送
        if: always() && github.event.inputs.dry_run == 'true'
        env:
          FEISHU_APP_SECRET: ""
        run: python build_daily_chart.py || true

      - name: 存档文字日报
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-${{ github.run_id }}
          path: .daily_digest/*
          include-hidden-files: true
          retention-days: 14

      - name: 存档图表(创业版)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charts-${{ github.run_id }}
          path: .growth_dividend_cache/chart_all_in_one_*.png
          retention-days: 7
      - name: 存档图表(科创版)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charts-kechuang-${{ github.run_id }}
          path: .kechuang50_cache/chart_all_in_one_*.png
          retention-days: 7

