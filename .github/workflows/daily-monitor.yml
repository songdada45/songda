name: 每日成长/红利风格轮动监控

on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: 运行成长/红利风格轮动监控(创业版)
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: python growth_dividend_monitor.py
      - name: 运行科创50/红利风格轮动监控(科创版)
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: python kechuang50_monitor.py
      - name: 存档图表(创业版)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charts-${{ github.run_id }}
          path: .growth_dividend_cache/chart_all_in_one_*.png
          retention-days: 7
      - name: 存档图表(科创版)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: charts-kechuang-${{ github.run_id }}
          path: .kechuang50_cache/chart_all_in_one_*.png
          retention-days: 7

